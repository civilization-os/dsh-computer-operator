name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${expected}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version ${expected}"

      - name: Check whether this version is already published
        id: package
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} will be published."
          fi

      - name: Publish to npm
        if: steps.package.outputs.publish == 'true'
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/ || npm publish --access public --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify package is live on npm
        if: steps.package.outputs.publish == 'true'
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 20); do
            if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is live on npm."
              exit 0
            fi
            echo "Waiting for ${package_name}@${package_version} to appear on npm (attempt ${attempt}/20)..."
            sleep 10
          done
          echo "::warning::Package ${package_name}@${package_version} was published, but not yet indexed in npm search registry within 200s."
